services:
  mysql:
    image: mysql:8.4
    ports: ["127.0.0.1:33306:3306"]
    environment:
      MYSQL_DATABASE: enjoytrip
      MYSQL_USER: enjoytrip
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?개인 .env 파일에 MYSQL_PASSWORD를 설정하세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?개인 .env 파일에 MYSQL_ROOT_PASSWORD를 설정하세요}
    volumes: ["mysql-data:/var/lib/mysql"]
volumes:
  mysql-data:
